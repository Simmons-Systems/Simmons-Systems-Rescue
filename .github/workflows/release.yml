name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Build USB images, attest, release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils dosfstools parted util-linux mtools curl gpg

      - name: Build SystemRescue rescue.img
        run: |
          mkdir -p dist
          ./bin/build-rescue-usb.sh --output dist/rescue.img

      - name: Build Memtest86+ memtest.img
        run: |
          ./bin/build-memtest-usb.sh --output dist/memtest.img

      - name: Compress artifacts
        run: |
          xz -T0 -9 dist/rescue.img
          xz -T0 -9 dist/memtest.img
          (cd dist && sha256sum *.img.xz > SHA256SUMS)

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/*.xz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*.xz
            dist/SHA256SUMS
